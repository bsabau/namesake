# Deploys main to the demo host once CI has passed on it, with deploy/deploy.sh (which
# rolls back on any failure). The Qloo and model keys stay in the host's .env: this
# never runs --env or --seed. Secrets live in the "production" environment, which only
# main may use: DEPLOY_SSH_KEY (the deploy user's key), DEPLOY_KNOWN_HOSTS (the host's
# pinned key) and DEPLOY_HOST (deploy@host). "Run workflow" redeploys main as it is,
# without waiting for CI.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cut one off: its rollback must be able to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # A push to main that passed CI, never a pull request; or "Run workflow" on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    # deploy.sh caps the build at 25 minutes, which leaves time for its checks and for a
    # rollback: a timeout here would cut one off.
    timeout-minutes: 45
    environment:
      name: production
      url: https://namesake.bogdansabau.eu
    steps:
      # Pinned to a commit: this job holds a key that is as good as root on the host.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # A run that waited behind a newer one, or whose CI finished late, must not put an
      # older commit back: only main's newest commit is deployed.
      - name: Still the newest commit on main
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$newest" != "$(git rev-parse HEAD)" ]; then
            echo "Skipped: main has a newer commit, which its own run deploys." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH key and the host's pinned key
        if: steps.fresh.outputs.skip != '1'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        if: steps.fresh.outputs.skip != '1'
        env:
          NAMESAKE_HOST: ${{ secrets.DEPLOY_HOST }}
          NAMESAKE_URL: https://namesake.bogdansabau.eu
        run: deploy/deploy.sh
