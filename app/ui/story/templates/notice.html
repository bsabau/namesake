{% extends "base.html" %}

{% block title %}{{ view.title }} · Namesake{% endblock %}

{% block content %}
<section class="notice" data-role="notice">
  <h1>{{ view.title }}</h1>
  <p>{{ view.message }}</p>
  <ul>
    {% for label, url in view.links %}<li><a href="{{ url }}">{{ label }}</a></li>{% endfor %}
  </ul>
</section>
{% endblock %}
