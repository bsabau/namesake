<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Namesake{% endblock %}</title>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ ui_static('style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/{% if ui_query %}?{{ ui_query[1:] }}{% endif %}">Namesake</a>
    <span class="tagline">Accurate adoption listings, and a plan to get every animal seen</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p data-role="photo-credit">{{ view.credits.photos }}</p>
    <p data-role="qloo-credit">{{ view.credits.qloo }}</p>
  </footer>
</body>
</html>
