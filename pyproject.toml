[project]
name = "namesake"
version = "0.1.0"
description = "Adoption listings for shelter animals, tuned to local taste with Qloo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "pydantic-ai-slim[openai]>=2.56.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
