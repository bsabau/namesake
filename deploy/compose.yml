# Production: one Namesake container behind the host's Caddy, which serves ports 80 and
# 443 for every site on the host (see deploy/README.md). Lives on the server as /opt/namesake/compose.yml,
# next to src/ (the committed source), var/ (the private cache) and .env (keys, mode 600).
name: namesake

services:
  app:
    build: ./src
    # Named, so deploy.sh can keep the previous build as namesake-app:prev to roll back to.
    image: namesake-app
    restart: unless-stopped
    env_file: .env
    volumes:
      # The SQLite cache, saved results and approvals: private to the server, never in git.
      - ./var:/app/var
    networks:
      proxy:
        aliases: [namesake]
    # No published port: only the proxy reaches the app, as namesake:8000.

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env to the Caddy container's Docker network}
